# Lance les tests du moteur et la vérification des invariants du §9 sur chaque pull request, et sur main.
name: Tests et invariants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du moteur
        run: node tools/test.js
      - name: Invariants du §9
        if: ${{ !cancelled() }}
        run: node tools/check.js
